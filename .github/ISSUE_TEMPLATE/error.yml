name: Error
description: Algo no funciona como dice la documentación.
title: "[Error] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportarlo. **No incluyas claves, tokens ni el contenido de `.env`.**
        Si es una vulnerabilidad, no abras un issue: usa Security → Report a vulnerability.
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Skills (new-agent, add-tool, add-eval…)
        - Subagentes
        - Hooks
        - Esqueleto de agente (código generado)
        - Plantillas de proyecto (reglas, Dockerfile, CI)
        - Instalación / marketplace
        - No lo sé
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. En un proyecto vacío, ejecuto `/agentic-harness:new-agent …`
        2. …
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas
    validations:
      required: true
  - type: textarea
    id: obtenido
    attributes:
      label: Qué ocurrió
      description: Mensajes de error o salida relevante, sin secretos.
      render: text
    validations:
      required: true
  - type: input
    id: version-plugin
    attributes:
      label: Versión del plugin
      description: "`claude plugin list`"
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: version-claude
    attributes:
      label: Versión de Claude Code
      description: "`claude --version`"
    validations:
      required: true
  - type: input
    id: sistema
    attributes:
      label: Sistema operativo
      placeholder: "macOS 15, Ubuntu 24.04, WSL…"
  - type: textarea
    id: contexto
    attributes:
      label: Contexto adicional
